<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"JetBrains Mono";font-weight:400;src:url(../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-400-normal.woff2)}
@font-face{font-family:"JetBrains Mono";font-weight:500;src:url(../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2)}
@font-face{font-family:"JetBrains Mono";font-weight:700;src:url(../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-700-normal.woff2)}
*{margin:0;padding:0} html,body{width:1920px;height:1080px;overflow:hidden;background:#071416} canvas{display:block}
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="../termkit.js"></script>
<script>
const W = 1920, H = 1080, T = TK.THEMES.drain, C = document.getElementById("c"), x = C.getContext("2d");
x.imageSmoothingEnabled = false;
const F = (n, w) => (w || 400) + " " + n + "px 'JetBrains Mono', monospace";
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), ease = t => { t = clamp(t, 0, 1); return 1 - Math.pow(1 - t, 3); };
const typed = (s, u, start, cps) => s.slice(0, clamp(Math.floor((u - start) * cps), 0, s.length));
const DARKRED = "#b8232f", HAIR = "#11282b", EMPTY = "#16373b", LINE = T.line;

// ---- the timeline: [name, length in seconds] ----
const SCENES = [["hook", 3.6], ["exit", 4.0], ["intro", 4.0], ["board", 5.6], ["checks", 4.4], ["end", 5.4]];
const STARTS = []; { let a = 0; for (const [, l] of SCENES) { STARTS.push(a); a += l; } }
const TOTAL = SCENES.reduce((s, q) => s + q[1], 0);
// moments the soundtrack hits (exported for the audio script)
const CUES = {};

function bg() {
  x.globalAlpha = 1; x.fillStyle = T.bg; x.fillRect(0, 0, W, H);
  x.fillStyle = "rgba(220,244,244,.04)"; for (let yy = 18; yy < H; yy += 28) for (let xx = 18; xx < W; xx += 28) x.fillRect(xx, yy, 2, 2);
}
function text(s, xx, yy, size, col, w, align) { x.font = F(size, w); x.fillStyle = col; x.textAlign = align || "left"; x.fillText(s, xx, yy); x.textAlign = "left"; return x.measureText(s).width; }
function cursor(xx, yy, size, u) { if (Math.floor(u * 2.4) % 2) return; x.fillStyle = T.accent; x.shadowColor = T.accent; x.shadowBlur = 22; x.fillRect(xx, yy - size * .78, size * .55, size * .95); x.shadowBlur = 0; }
function prompt(cmd, u, start, yy, px) { px = px || 160; const w = text("anon@flushed ~ % ", px, yy, 30, T.muted); const t = typed(cmd, u, start, 30); const w2 = text(t, px + w, yy, 30, T.ink); if (t.length < cmd.length) cursor(px + w + w2 + 4, yy, 30, u); }
function chip(label, xx, yy, w, h, kind, size, glow) {
  x.lineWidth = 3;
  if (kind === "CLEAN") { x.fillStyle = T.accent; x.shadowColor = T.accent; x.shadowBlur = glow ?? 30; x.fillRect(xx, yy, w, h); x.shadowBlur = 0; x.fillStyle = T.bg; }
  else { const col = kind === "LOADED" ? T.red : kind === "LIVE" ? T.accent : T.ink; x.strokeStyle = kind === "DRAINING" ? LINE : col; x.strokeRect(xx + 1.5, yy + 1.5, w - 3, h - 3); x.fillStyle = col; }
  x.font = F(size, 700); x.textAlign = "center"; x.fillText(label, xx + w / 2, yy + h / 2 + size * .36); x.textAlign = "left";
}
function panel(x0, y0, w, h) { x.fillStyle = T.shadow; x.fillRect(x0 + 10, y0 + 10, w, h); x.fillStyle = T.card; x.fillRect(x0, y0, w, h); x.strokeStyle = LINE; x.lineWidth = 2; x.strokeRect(x0 + 1, y0 + 1, w - 2, h - 2); }

// ---- 1 · hook: every coin has snipers ----
function hook(u) {
  bg();
  text("anon@flushed ~ %", 160, 330, 30, T.muted);
  const line = "every new coin has snipers.", t1 = typed(line, u, .15, 22);
  const w = text(t1, 160, 450, 88, T.ink, 500); cursor(160 + w + 12, 450, 88, u);
  const a = ease((u - 1.45) / .35); if (a <= 0) return;
  x.globalAlpha = a;
  text("supply", 160, 560, 26, T.muted); text("block 0", 1760, 560, 26, T.red, 400, "right");
  const n = 40, cw = 40, x0 = 160, y0 = 584, hh = 96, fill = clamp((u - 1.7) / 1.1, 0, 1) * 13;
  for (let i = 0; i < n; i++) {
    let c = HAIR;
    if (i < 2) c = "#c9d6d6"; else if (i < 15) c = i - 2 < fill ? (i < 9 ? DARKRED : T.red) : HAIR;
    x.fillStyle = c; x.fillRect(x0 + i * cw, y0, cw - 6, hh);
  }
  const b = ease((u - 2.85) / .35); if (b > 0) { x.globalAlpha = a * b; text("11 wallets bought in block 0–2.", 160, 770, 40, T.red, 500); text("they hold 24% of the supply.", 160, 826, 40, T.ink); }
  x.globalAlpha = 1;
}
CUES.typeA = [.15, .15 + 27 / 22]; CUES.fill = [1.7, 2.8]; CUES.reveal = [2.85];

// ---- 2 · every pump is their exit ----
const PEAKS = [.22, .52, .82];
function price(t) {           // three pumps, each sold into
  let v = .2 + t * .05;
  PEAKS.forEach((p, i) => { const up = Math.exp(-Math.pow((t - p) / .07, 2)) * (.42 + i * .04); v += t < p ? up : up * Math.max(0, 1 - (t - p) / .05) + (t > p ? 0 : 0); });
  return v;
}
function exit(u) {
  bg();
  const line = "until they sell, every pump is their exit.";
  x.font = F(60, 500); const t1 = typed(line, u, .1, 46), w = text(t1, 160, 290, 60, T.ink, 500); if (t1.length < line.length) cursor(160 + w + 10, 290, 60, u);
  const x0 = 160, x1 = 1760, y0 = 380, y1 = 900, r = clamp((u - .7) / 3.0, 0, 1);
  x.fillStyle = LINE; x.fillRect(x0, y1, x1 - x0, 2);
  text("price", x0, y0 - 14, 24, T.muted);
  const px = t => x0 + t * (x1 - x0), py = v => y1 - 10 - v / .72 * (y1 - y0 - 30);
  for (let t = 0; t <= r; t += .004) { x.fillStyle = T.accent; x.fillRect(Math.round(px(t)) - 3, Math.round(py(price(t))) - 3, 7, 7); }
  PEAKS.forEach((p, i) => {
    if (r < p) return; const k = clamp((r - p) / .06, 0, 1), xx = px(p);
    // sell blocks raining off the peak
    for (let j = 0; j < 7; j++) { const yy = py(price(p)) + 30 + j * 26 * k; x.globalAlpha = (1 - j / 8) * k; x.fillStyle = T.red; x.fillRect(xx + 18 + (j % 2) * 12, yy, 14, 14); }
    x.globalAlpha = k; text(i === 1 ? "you bought. they sold." : "sniper sells", xx + 44, py(price(p)) + 8, 28, T.red, 700);
    x.globalAlpha = 1;
  });
}
CUES.typeB = [3.6 + .1, 3.6 + .1 + 42 / 46]; CUES.sells = PEAKS.map(p => 3.6 + .7 + p * 3.0 + .05);

// ---- 3 · FLUSHED ----
let SHADOW3 = null;
function intro(u) {
  bg();
  const cell = 14, ox = 250, oy = 150, g0 = TK.OBJECTS.fmono({ p: 1 });
  if (!SHADOW3) { SHADOW3 = document.createElement("canvas"); SHADOW3.width = W; SHADOW3.height = H; const s = SHADOW3.getContext("2d"), sil = document.createElement("canvas");
    sil.width = g0.w * cell; sil.height = g0.h * cell; const q = sil.getContext("2d"); q.fillStyle = T.shadow;
    for (let yy = 0; yy < g0.h; yy++) for (let xx = 0; xx < g0.w; xx++) if (g0.get(xx, yy)) q.fillRect(xx * cell, yy * cell, cell, cell);
    for (let i = 1; i <= 1500; i++) s.drawImage(sil, ox + i, oy + i); }
  const a = ease(u / .45); x.globalAlpha = a; x.drawImage(SHADOW3, 0, 0);
  const p = u < 1 ? 1 : u < 3.0 ? 1 - (u - 1) / 2.0 : 0, fill = u < 3.1 ? 0 : clamp((u - 3.1) / .6, 0, 1);
  const g = TK.OBJECTS.fmono({ p: Math.round(p * 7) / 7, fill: Math.round(fill * 7) / 7, drips: u < 3.1 });
  TK.draw(x, g, { theme: T, cell, x: ox, y: oy - (1 - a) * 30, shadow: false });
  x.globalAlpha = 1;
  const tx = 860;
  x.globalAlpha = ease((u - .2) / .3); prompt("flushed watch --live", u, .3, 300, tx + 6); x.globalAlpha = 1;
  x.globalAlpha = ease((u - .5) / .35); text("flushed", tx, 470, 168, T.ink, 700); x.globalAlpha = 1;
  x.globalAlpha = ease((u - 1.1) / .35); text("tracks every sniper and bundle bag,", tx + 6, 580, 42, T.muted); x.globalAlpha = 1;
  x.globalAlpha = ease((u - 1.6) / .35); text("live, from block 0.", tx + 6, 640, 42, T.muted); x.globalAlpha = 1;
  x.globalAlpha = ease((u - 2.3) / .35); text("buys only once they're out.", tx + 6, 730, 50, T.accent, 700); x.globalAlpha = 1;
}
CUES.intro = [7.6, 7.6 + .5, 7.6 + 2.3]; CUES.cleanF = [7.6 + 3.1];

// ---- 4 · the flush board ----
const ROWS = [
  ["$ORBIT", "41m", 6.2, 8.1, 1.2, .55, .03],
  ["$TOAST", "18m", 4.6, 2.6, 0.0, .13, .45],
  ["$GLUE", "6m", 14.2, 9.4, 4.1, .05, .85],
  ["$MOTH", "27m", 3.0, 1.4, 2.2, .45, .08],
  ["$PLANK", "11m", 8.2, 6.1, 0.0, .16, .40],
];
function rowState(r, u) { const [, , sn0, bu0, dev, speed, floor] = r, left = Math.max(floor, 1 - speed * Math.max(0, u - .9));
  const sn = sn0 * left, bu = bu0 * left, miss = (sn >= 2) + (bu >= 3) + (dev >= 3) + (left > .45 ? 1 : 0);
  const g = sn > 10 ? "LOADED" : miss === 0 ? "CLEAN" : miss === 1 ? "DRAINING" : "LOADED"; return { left, sn, bu, dev, g }; }
const ORBIT_CLEAN = (() => { for (let u = 0; u < 6; u += 1 / 30) if (rowState(ROWS[0], u).g === "CLEAN") return u; return 9; })();
function board(u) {
  bg();
  text("01 · flush board", 160, 150, 24, T.accent, 500);
  x.globalAlpha = ease(u / .3); text("%", 160, 228, 64, T.faint || "#365759", 500); text("flushed board --live", 220, 228, 64, T.ink, 500); x.globalAlpha = 1;
  const x0 = 160, y0 = 280, w = 1600, h = 600; panel(x0, y0, w, h);
  x.fillStyle = T.accent; x.shadowColor = T.accent; x.shadowBlur = 10; if (Math.floor(u * 1.6) % 2 === 0) x.fillRect(x0 + 28, y0 + 30, 12, 12); x.shadowBlur = 0;
  text("pump.fun + launchlab · every trade from block 0", x0 + 54, y0 + 44, 22, T.muted);
  text("LIVE", x0 + w - 28, y0 + 44, 22, T.accent, 700, "right");
  x.fillStyle = LINE; x.fillRect(x0, y0 + 72, w, 2);
  const cols = { sym: x0 + 30, sn: x0 + 470, bu: x0 + 620, dev: x0 + 760, mt: x0 + 820, gr: x0 + 1360 };
  const hy = y0 + 112; x.font = F(18, 500);
  [["coin", cols.sym, "left"], ["snipers", cols.sn, "right"], ["bundles", cols.bu, "right"], ["dev", cols.dev, "right"], ["flushed", cols.mt, "left"], ["grade", cols.gr + 100, "center"]].forEach(([l, xx, al]) => text(l.toUpperCase(), xx, hy, 18, T.muted, 500, al));
  ROWS.forEach((r, i) => {
    const a = ease((u - .15 - i * .1) / .3); if (a <= 0) return; const ry = y0 + 140 + i * 90, s = rowState(r, u);
    x.globalAlpha = a; x.fillStyle = HAIR; x.fillRect(x0 + 20, ry + 80, w - 40, 1);
    if (i === 0 && s.g === "CLEAN") { x.fillStyle = "rgba(63,214,224,.07)"; x.fillRect(x0 + 2, ry + 4, w - 4, 76); x.fillStyle = T.accent; x.fillRect(x0 + 2, ry + 14, 4, 56); }
    text(r[0], cols.sym, ry + 54, 32, T.ink, 700); text(r[1], cols.sym + 190, ry + 54, 22, T.muted);
    const pc = (v, lim) => (v >= 10 ? Math.round(v) : v.toFixed(1)) + "%";
    text(pc(s.sn), cols.sn, ry + 54, 28, s.sn < 2 ? T.accent : T.red, 500, "right");
    text(pc(s.bu), cols.bu, ry + 54, 28, s.bu < 3 ? T.accent : T.red, 500, "right");
    text(pc(s.dev), cols.dev, ry + 54, 28, s.dev < 3 ? T.accent : T.red, 500, "right");
    const n = 26, sw = 18, red = Math.round(s.left * n);
    for (let k = 0; k < n; k++) { x.fillStyle = k < red ? T.red : T.accent; x.globalAlpha = a * (k < red ? 1 : .85); x.fillRect(cols.mt + k * sw, ry + 30, sw - 4, 30); }
    x.globalAlpha = a; text(Math.round((1 - s.left) * 100) + "%", cols.mt + n * sw + 16, ry + 54, 22, T.muted);
    chip(s.g, cols.gr, ry + 22, 200, 46, s.g, 20, 18);
    x.globalAlpha = 1;
  });
  // the alert
  const k = ease((u - ORBIT_CLEAN - .15) / .3);
  if (k > 0) { const tx = 160, ty = 920 + (1 - k) * 30; x.globalAlpha = k;
    x.fillStyle = T.shadow; x.fillRect(tx + 8, ty + 8, 760, 100); x.fillStyle = T.card; x.fillRect(tx, ty, 760, 100); x.strokeStyle = T.accent; x.lineWidth = 3; x.shadowColor = T.accent; x.shadowBlur = 20; x.strokeRect(tx + 1.5, ty + 1.5, 757, 97); x.shadowBlur = 0;
    chip("CLEAN", tx + 22, ty + 28, 130, 44, "CLEAN", 18, 12);
    text("$ORBIT just turned CLEAN", tx + 176, ty + 48, 28, T.ink, 700); text("snipers 1.8% · bundles 2.4% · dev 1.2%", tx + 176, ty + 82, 20, T.muted); x.globalAlpha = 1; }
}
CUES.rows = [11.6 + .15]; CUES.cleanBoard = [11.6 + ORBIT_CLEAN];

// ---- 5 · six checks, then the engine ----
const CHECKS = [["snipers out", "under 2% · they hold 0.9%"], ["bundles out", "under 3% · they hold 1.1%"], ["dev overhang", "under 3% · dev holds 1.2%"], ["holders survived", "212 → 488 while they sold"], ["price held", "deepest dip 31%"], ["buyers now", "64 buys / 31 sells · 71 wallets"]];
function checks(u) {
  bg();
  text("% flushed checks $ORBIT", 160, 190, 52, T.ink, 500);
  CHECKS.forEach(([n, v], i) => {
    const t0 = .35 + i * .3, a = ease((u - t0 + .2) / .2); if (a <= 0) return; const yy = 300 + i * 100, on = u >= t0;
    x.globalAlpha = a; x.fillStyle = on ? T.accent : HAIR; x.fillRect(160, yy - 34, 44, 44);
    if (on) { x.fillStyle = T.bg; x.font = F(32, 700); x.fillText("✓", 170, yy); }
    text(n, 232, yy - 4, 38, T.ink, 500); text(v, 232, yy + 34, 24, T.muted); x.globalAlpha = 1;
  });
  const flip = 2.3, gx = 1120, gy = 300, cw = 640, ch = 170, a = ease(u / .3);
  x.globalAlpha = a;
  if (u < flip) chip("DRAINING", gx, gy, cw, ch, "DRAINING", 64);
  else { const pop = 1 + .06 * Math.max(0, 1 - (u - flip) / .25); x.save(); x.translate(gx + cw / 2, gy + ch / 2); x.scale(pop, pop); chip("CLEAN", -cw / 2, -ch / 2, cw, ch, "CLEAN", 76, 50); x.restore(); }
  text("6 / 6 checks", gx + cw / 2, gy + ch + 50, 28, u < flip ? T.muted : T.accent, 500, "center");
  x.globalAlpha = 1;
  [["engine buys.", 2.7, T.ink], ["sells at 2x, or a −25% stop.", 3.05, T.ink], ["profit buys back $FLUSHED.", 3.4, T.accent]].forEach(([s, t0, col]) => { const k = ease((u - t0) / .3); if (k <= 0) return; x.globalAlpha = k; text(s, gx, 640 + (t0 - 2.7) / .35 * 70, 44, col, 700); x.globalAlpha = 1; });
  const k = ease((u - 3.7) / .3); if (k > 0) { x.globalAlpha = k; text("public wallet · beta", gx, 900, 24, T.muted); x.globalAlpha = 1; }
}
CUES.ticks = CHECKS.map((_, i) => 17.2 + .35 + i * .3); CUES.cleanChip = [17.2 + 2.3]; CUES.engine = [17.2 + 2.7, 17.2 + 3.05, 17.2 + 3.4];

// ---- 6 · end card ----
function end(u) {
  bg();
  const a = ease(u / .35), sz = 220; x.globalAlpha = a;
  const s = .85 + .15 * a; x.save(); x.translate(W / 2, 250); x.scale(s, s); TK.tile(x, sz, { x: -sz / 2, y: -sz / 2, frac: .64 }); x.restore();
  x.globalAlpha = ease((u - .3) / .35); text("$FLUSHED", W / 2, 560, 170, T.ink, 700, "center");
  x.globalAlpha = ease((u - .8) / .35); text("the snipers are out. now it can run.", W / 2, 650, 48, T.muted, 400, "center");
  const k = ease((u - 1.3) / .35); x.globalAlpha = k;
  x.font = F(34, 500); const rest = "on pump.fun  ·  @FlushedEngine", rw = x.measureText(rest).width, cw = 150, tot = cw + 26 + rw, sx = W / 2 - tot / 2;
  chip("LIVE", sx, 760, cw, 64, "CLEAN", 32, 24); text(rest, sx + cw + 26, 804, 34, T.ink, 500);
  x.globalAlpha = 1;
}
CUES.end = [21.6, 21.6 + .3, 21.6 + 1.3];

// ---- master ----
function render(t) {
  let i = SCENES.length - 1; for (let k = 0; k < SCENES.length; k++) if (t < STARTS[k] + SCENES[k][1]) { i = k; break; }
  const u = t - STARTS[i], L = SCENES[i][1];
  ({ hook, exit, intro, board, checks, end })[SCENES[i][0]](u);
  // quick dip through the background between scenes
  const fin = i === 0 ? 1 : clamp(u / .2, 0, 1), fout = i === SCENES.length - 1 ? 1 : clamp((L - u) / .2, 0, 1), k = Math.min(fin, fout);
  if (k < 1) { x.globalAlpha = 1 - k; x.fillStyle = T.bg; x.fillRect(0, 0, W, H); x.globalAlpha = 1; }
}
window.META = { TOTAL, SCENES, STARTS, CUES };
Promise.all([document.fonts.load("400 40px 'JetBrains Mono'"), document.fonts.load("500 40px 'JetBrains Mono'"), document.fonts.load("700 40px 'JetBrains Mono'")]).then(() => { render(0); document.body.dataset.ready = 1; });
</script></body></html>
